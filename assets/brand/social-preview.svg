    SOFTWARE · IA APLICADA · CLOUD
  </text>
  <text
    x="552"
    y="232"
    fill="#fafaf9"
    font-family="DejaVu Sans, sans-serif"
    font-size="76"
    font-weight="900"
    letter-spacing="-4"
  >
    ALLFICTION
  </text>
  <text
    x="552"
    y="312"
    fill="url(#gold)"
    font-family="DejaVu Sans, sans-serif"
    font-size="76"
    font-weight="900"
    letter-spacing="-4"
  >
    SOFTWARE
  </text>

  <line x1="558" y1="356" x2="646" y2="356" stroke="#facc15" stroke-width="3" />
  <text
    x="558"
    y="406"
    fill="#e7e5e4"
    font-family="DejaVu Sans, sans-serif"
    font-size="29"
    font-weight="600"
