    Evidencia real.
  </text>

  <g font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">
    <rect x="558" y="492" width="166" height="48" rx="24" fill="#facc15" fill-opacity="0.08" stroke="#facc15" stroke-opacity="0.34" />
    <text x="641" y="522" fill="#fde68a" text-anchor="middle">CRYPTO RISK</text>

    <rect x="740" y="492" width="128" height="48" rx="24" fill="#facc15" fill-opacity="0.08" stroke="#facc15" stroke-opacity="0.34" />
    <text x="804" y="522" fill="#fde68a" text-anchor="middle">QIVOX</text>

    <rect x="884" y="492" width="202" height="48" rx="24" fill="#facc15" fill-opacity="0.08" stroke="#facc15" stroke-opacity="0.34" />
    <text x="985" y="522" fill="#fde68a" text-anchor="middle">POLYLLM ROUTER</text>
  </g>

  <text
    x="558"
    y="572"
    fill="#78716c"
    font-family="DejaVu Sans, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="2"
  >
    CÓRDOBA · ARGENTINA
  </text>
</svg>
