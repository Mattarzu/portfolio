<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505" />
      <stop offset="0.58" stop-color="#0b0b0b" />
      <stop offset="1" stop-color="#161006" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="0.45" stop-color="#a16207" stop-opacity="0.07" />
      <stop offset="1" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#facc15" />
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#facc15" stroke-opacity="0.045" />
    </pattern>
    <clipPath id="logoClip">
      <rect x="58" y="58" width="444" height="514" rx="32" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.58" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <rect
    x="34"
    y="34"
    width="1132"
    height="562"
    rx="38"
    fill="#090909"
    fill-opacity="0.72"
    stroke="#facc15"
    stroke-opacity="0.22"
  />
  <path d="M34 148V72Q34 34 72 34H218" fill="none" stroke="#facc15" stroke-width="3" />
  <path d="M982 596H1128Q1166 596 1166 558V482" fill="none" stroke="#facc15" stroke-width="3" />

  <g clip-path="url(#logoClip)" filter="url(#shadow)">
    <image
      xlink:href="allfiction-software-hero.png"
      x="-234"
      y="57"
      width="914"
      height="514"
      preserveAspectRatio="xMidYMid slice"
