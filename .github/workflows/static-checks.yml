name: static checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check contact-config.js
          node --check assets/js/home-v3.js
          node --check assets/js/home-v4.js
          node --check assets/js/home-v5.js
          node --check assets/js/home-v6.js
          node --check assets/js/home-v7.js
          node --check assets/js/home-v9.js
          node --check assets/js/home-v10.js
          node --check assets/js/home-v11.js
          node --check assets/js/home-v13.js
          node --check assets/js/home-v15.js
          node --check assets/js/panda-stable.js
          node --check mmlab-contact-worker/src/worker.js
          node --check mmlab-contact-worker/src/worker-v2.js
          node --check mmlab-contact-worker/src/ai-provider.js
          node --check mmlab-contact-worker/src/portfolio-context.js
          node --check mmlab-contact-worker/src/automation-analysis.js
          node --check mmlab-contact-worker/src/automation-endpoint.js
          node --check mmlab-contact-worker/src/agent-tools.js
          node --check mmlab-contact-worker/src/agent-tool-definitions.js
          node --check mmlab-contact-worker/src/agent-tool-runtime.js
          node --check mmlab-contact-worker/src/agent-provider.js
          node --check mmlab-contact-worker/src/agent-endpoint.js
          node --check mmlab-contact-worker/src/intent-router.js
          node --check assets/js/i18n.js
          node --check assets/js/redwatch-panel.js
          node --check scripts/check-site.mjs
          node --check scripts/check-v13.mjs
          node --check scripts/check-v14.mjs
          node --check scripts/check-v15.mjs
          node --check scripts/run-af-evals.mjs

      - name: Check site contracts
        run: |
          node scripts/check-site.mjs
          node scripts/check-v13.mjs
          node scripts/check-v14.mjs
          node scripts/check-v15.mjs

      - name: Run AF reliability evals
        run: node scripts/run-af-evals.mjs --verify

      - name: Test AF Intelligence
        run: npm test --prefix mmlab-contact-worker

      - name: Validate V3 HTML
        run: |
          npx --yes html-validate@11.5.6 \
            index.html \
            projects/index.html \
            projects/crypto-risk-engine.html \
            404.html

      - name: Check whitespace
        run: git diff --check

      - name: Check Markdown fences
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("mmlab-contact-api/README.md"),
              Path("docs/operations/mmlab-backend-architecture.md"),
              Path("docs/operations/panda-ai-local-assistant.md"),
              Path("docs/operations/current-architecture-checklist.md"),
          ]

          ok = True

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()
              fences = text.count("```")
              print(f"{path}: fences={fences}")

              if fences % 2 != 0:
                  ok = False
                  print(f"ERROR: odd number of markdown fences in {path}")

          if not ok:
              raise SystemExit(1)
          PY

      - name: Guard V3 ownership
        run: |
          grep -q 'assets/css/home-v3.css' index.html
          grep -q 'assets/js/home-v3.js' index.html
          grep -q 'contact-config.js' index.html
          grep -q 'AF Intelligence' index.html
          grep -q 'Gemini Free Tier' index.html
          grep -q 'projects/crypto-risk-engine.html' index.html
          grep -q 'AI_PROVIDER = "gemini"' mmlab-contact-worker/wrangler.toml
          grep -q 'AI_MODEL = "gemini-3.5-flash-lite"' mmlab-contact-worker/wrangler.toml
          grep -q 'main = "src/worker-v2.js"' mmlab-contact-worker/wrangler.toml
          grep -q 'home-v11.js' contact-config.js
          grep -q 'home-v13.js' contact-config.js
          grep -q 'home-v15.js' contact-config.js
          grep -q 'deterministic-regression' assets/data/af-reliability.json
          ! grep -q 'mattarzu.github.io/portfolio' index.html
