# Manual production publish for the static frontend.
# Merging to main does not publish. There is no push trigger.
# This workflow runs pages deploy only. It does not deploy the Worker.

name: Deploy portfolio frontend to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: portfolio-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require production configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main. It publishes the production Pages branch."
            exit 1
          fi

          missing=0

          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi

          if [ -z "${CLOUDFLARE_PAGES_PROJECT}" ]; then
            echo "::error::Missing repository variable CLOUDFLARE_PAGES_PROJECT"
            missing=1
          elif ! printf '%s' "${CLOUDFLARE_PAGES_PROJECT}" | grep -Eq '^[a-z][a-z0-9-]{0,57}$'; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT must be the Pages project slug: a lowercase letter, then lowercase letters, digits, or hyphens."
            missing=1
          elif [ "${CLOUDFLARE_PAGES_PROJECT}" = "pages-project-name" ]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT is still a placeholder."
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "Refusing to publish. Create the Pages project and the named secret or variable, then run this workflow again from main."
            exit 1
          fi

          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "project=${CLOUDFLARE_PAGES_PROJECT}" >> "${GITHUB_OUTPUT}"

      - name: Prepare publish directory
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/prepare-pages-output.mjs

      - name: Check published output
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/check-pages-cutover.mjs

      - name: Publish to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ steps.cloudflare.outputs.project }} --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public deployment
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          PAGES_PROJECT: ${{ steps.cloudflare.outputs.project }}
        run: |
          set -euo pipefail

          URL="https://${PAGES_PROJECT}.pages.dev"
          echo "Verifying ${URL}"

          for attempt in {1..5}; do
            HOME_HTML="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 20 \
                "$URL/" \
                || true
            )"

            CRYPTO_HTML="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 20 \
                "$URL/projects/crypto-risk-engine.html" \
                || true
            )"

            CONFIG_JS="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 20 \
                "$URL/contact-config.js?v=20260813-v15" \
                || true
            )"

            RELIABILITY_JSON="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 20 \
                "$URL/assets/data/af-reliability.json?v=20260813-v15" \
                || true
            )"

            if grep -q 'Crypto Risk Engine' <<<"$HOME_HTML" \
              && grep -q 'AF Intelligence' <<<"$HOME_HTML" \
              && grep -q 'assets/js/home-v3.js' <<<"$HOME_HTML" \
              && grep -q 'home-v15.js' <<<"$CONFIG_JS" \
              && grep -q 'deterministic-regression' <<<"$RELIABILITY_JSON" \
              && grep -q '"failed": 0' <<<"$RELIABILITY_JSON" \
              && grep -q '"deterministicRegressionGate": true' <<<"$RELIABILITY_JSON" \
              && curl --fail --silent --show-error --max-time 20 \
                "$URL/assets/css/home-v3.css" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 \
                "$URL/assets/js/home-v3.js" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 \
                "$URL/assets/js/home-v15.js?v=20260813-v15" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 \
                "$URL/assets/css/home-v15.css?v=20260813-v15" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 \
                "$URL/assets/brand/allfiction-software-hero-960.webp" >/dev/null \
              && grep -q 'Redis Streams' <<<"$CRYPTO_HTML"
            then
              echo "Deployment verified: $URL"
              echo "AF Reliability public artifact verified."
              exit 0
            fi

            echo "Verification attempt $attempt failed."
            sleep 5
          done

          echo "Public deployment verification failed."
          exit 1
